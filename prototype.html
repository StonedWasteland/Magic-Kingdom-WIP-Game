<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Worlds — Combat Slice (MVP)</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d2029; --ink:#e7e9ee; --dim:#8b90a0;
    --party:#4ea1ff; --enemy:#ff5d5d; --ember:#ff8a3d; --root:#b07cff;
    --good:#57d98a; --warn:#ffd25a; --line:#2c3040;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  .topbar{display:flex;gap:18px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .doom{font-size:13px;background:var(--panel);border:1px solid var(--line);
    padding:6px 12px;border-radius:8px}
  .doom b{color:var(--enemy);font-size:16px}
  .pip{color:var(--warn)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .col h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:10px;position:relative}
  .card.party{border-left:3px solid var(--party)}
  .card.enemy{border-left:3px solid var(--enemy)}
  .card.active{outline:2px solid var(--party);outline-offset:1px}
  .card.targetable{cursor:pointer;outline:2px dashed var(--ember);outline-offset:1px}
  .card.targetable:hover{background:#262a36}
  .card.down{opacity:.4;filter:grayscale(1)}
  .name{font-weight:600}
  .name small{color:var(--dim);font-weight:400}
  .band{float:right;font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:1px 7px}
  .hpwrap{height:14px;background:#0d0f14;border-radius:7px;overflow:hidden;margin:7px 0 4px;border:1px solid var(--line)}
  .hp{height:100%;background:linear-gradient(90deg,#3a7d4f,var(--good));transition:width .25s}
  .enemy .hp{background:linear-gradient(90deg,#7d3a3a,var(--enemy))}
  .hpnum{font-size:11px;color:var(--dim)}
  .chips{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;min-height:4px}
  .chip{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);cursor:help}
  .chip.rooted{color:var(--root);border-color:var(--root)}
  .chip.slowed{color:#7ad0ff;border-color:#7ad0ff}
  .chip.burning{color:var(--ember);border-color:var(--ember)}
  .chip.stagger{color:var(--warn);border-color:var(--warn)}
  .chip.fire{color:var(--ember);border-color:var(--ember);background:#2a1a0e}
  .chip.stoked{color:var(--good);border-color:var(--good);background:#0e2417}
  .chip.armor{color:#9fb4d0;border-color:#9fb4d0;background:#161a22}
  .chip.taunt{color:#ff9d5c;border-color:#ff9d5c}
  .chip.regen{color:var(--good);border-color:var(--good)}
  .chip.bleed{color:var(--enemy);border-color:var(--enemy)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
  .panel h3{margin:0 0 8px;font-size:13px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#2b3242;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer}
  button:hover:not(:disabled){background:#39435a;border-color:var(--party)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent}
  button.primary{background:var(--party);color:#06243f;border-color:var(--party);font-weight:600}
  .hint{color:var(--ember);font-size:12px;margin-top:8px;min-height:16px}
  .bandbtns{display:flex;gap:8px;margin-top:8px}
  #log{background:#0d0f14;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    height:190px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace}
  #log div{margin:0 0 2px}
  .l-hit{color:var(--good)} .l-part{color:var(--warn)} .l-miss{color:var(--dim)}
  .l-fire{color:var(--ember)} .l-root{color:var(--root)} .l-bad{color:var(--enemy)}
  .l-round{color:#fff;border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
  .win{font-size:16px;font-weight:600}
  .win.w{color:var(--good)} .win.l{color:var(--enemy)}
</style>
</head>
<body>
<h1>Magic Worlds — Combat Slice <small style="color:var(--dim)">MVP</small></h1>
<div class="sub">2d6 · 10+ full / 7–9 partial / 6− fail · lock it, then burn it · prove the tags talk.</div>

<div class="topbar">
  <div class="doom">DOOM <b id="doom">8</b> &nbsp;<span class="pip" id="doompips"></span></div>
  <div class="doom">ROUND <b id="round" style="color:var(--ink)">1</b></div>
  <div class="doom">TEAM <b id="teamlabel" style="color:var(--ink)">1</b></div>
  <button onclick="newGame(S.team===2?1:2)" style="margin-left:auto" title="Restart with the other squad">Switch squad ⇄</button>
</div>

<div class="cols">
  <div class="col"><h2>Your party</h2><div id="party"></div></div>
  <div class="col"><h2>Raiders</h2><div id="enemies"></div></div>
</div>

<div class="panel" id="control">
  <h3 id="ctrlhead">—</h3>
  <div class="acts" id="acts"></div>
  <div class="hint" id="hint"></div>
</div>

<div id="log"></div>

<script>
"use strict";
/* ─── Magic Worlds combat slice ──────────────────────────────────────────────
   One self-contained encounter that tests the engine thesis: tags reading tags.
   No framework. Re-render the whole board from `S` after every change.
   Resolution: 2d6 + mods vs FIXED thresholds (10+/7-9/6-). Every tag in scope
   is just a +/-1, so a combo is the sum of the tags present.                  */

const BANDS = ["Engaged","Near","Far"];           // index 0..2 = distance from front
const roll2 = () => { const a=1+Math.floor(Math.random()*6),
                            b=1+Math.floor(Math.random()*6); return {a,b,sum:a+b}; };
const tier  = n => n>=10 ? "full" : n>=7 ? "partial" : "fail";

let S;
function raiders(){ return [
  { id:"r1", name:"Raider A", role:"melee", side:"enemy", hp:16,max:16, band:1, st:{}, acted:false },
  { id:"r2", name:"Raider B", role:"melee", side:"enemy", hp:16,max:16, band:1, st:{}, acted:false },
  { id:"mar", name:"Marauder", role:"ranged", side:"enemy", hp:12,max:12, band:2, st:{}, acted:false },
  { id:"bru", name:"Brute", role:"brute", side:"enemy", hp:24,max:24, band:2, st:{}, acted:false, ctrlImmune:true },
  { id:"dis", name:"Disruptor", role:"disruptor", side:"enemy", hp:14,max:14, band:1, st:{}, acted:false },
]; }
function team1(){ return [
  { id:"steele", name:"Steele", role:"Metal", side:"party", hp:22,max:22, resolve:7, strain:0, focus:2, band:0, st:{}, acted:false, moved:false, stance:false },
  { id:"mason", name:"Mason", role:"Cement", side:"party", hp:20,max:20, resolve:6, strain:0, focus:2, band:1, st:{}, acted:false, moved:false },
  { id:"ember", name:"Ember", role:"Pyro", side:"party", hp:20,max:20, resolve:6, strain:0, focus:2, band:1, st:{}, acted:false, moved:false, affinity:"fire" },
  { id:"wren", name:"Wren", role:"Regen", side:"party", hp:18,max:18, resolve:6, strain:0, focus:2, band:1, st:{}, acted:false, moved:false },
  { id:"atlas", name:"Atlas", role:"Physical", side:"party", hp:20,max:20, resolve:6, strain:0, focus:2, band:0, st:{}, acted:false, moved:false },
]; }
function team2(){ return [
  { id:"cairn", name:"Cairn", role:"Gravity", side:"party", hp:22,max:22, resolve:7, strain:0, focus:2, band:0, st:{}, acted:false, moved:false, well:false },
  { id:"bryony", name:"Bryony", role:"Overgrowth", side:"party", hp:20,max:20, resolve:6, strain:0, focus:2, band:1, st:{}, acted:false, moved:false },
  { id:"vitra", name:"Vitra", role:"Glass", side:"party", hp:18,max:18, resolve:6, strain:0, focus:2, band:2, st:{}, acted:false, moved:false },
  { id:"sol", name:"Sol", role:"Radiance", side:"party", hp:18,max:18, resolve:6, strain:0, focus:2, band:1, st:{}, acted:false, moved:false },
  { id:"brand", name:"Brand", role:"Smith", side:"party", hp:20,max:20, resolve:6, strain:0, focus:2, band:0, st:{}, acted:false, moved:false },
]; }
function newGame(team){
  team = team || (S && S.team) || 1;
  S = {
    team:team, round:1, doom:8, phase:"party", pending:null, over:null, push:false,
    fire:[0,0,0], grown:[0,0,0], glass:[0,0,0], well:-1,   // zone state per band; well = band index or -1
    units:(team===2?team2():team1()).concat(raiders()),
  };
  document.getElementById("log").innerHTML = "";
  log(team===2
    ? "TEAM 2 vs a mixed warband (2 Raiders · Marauder · Brute · Disruptor). Gather → hold → reap — but the Brute ignores your control, the Marauder shoots your back line, the Disruptor strips your buffs. Adapt. (Hover an enemy's name to read its trait.)"
    : "TEAM 1 vs a mixed warband (2 Raiders · Marauder · Brute · Disruptor). Read the foes: the Brute can't be pinned, the Marauder hits from range, the Disruptor strips buffs. (Hover an enemy's name to read its trait.)", "l-round");
  render();
}

/* ─── helpers ─────────────────────────────────────────────────────────────── */
const U   = id => S.units.find(u=>u.id===id);
const alive = u => u.hp>0;
const party = () => S.units.filter(u=>u.side==="party");
const enemies = () => S.units.filter(u=>u.side==="enemy");
const liveEnemies = () => enemies().filter(alive);
const liveParty   = () => party().filter(alive);

function log(msg,cls){ const d=document.createElement("div");
  if(cls) d.className=cls; d.textContent=msg;
  const L=document.getElementById("log"); L.appendChild(d); L.scrollTop=L.scrollHeight; }

function damage(u,n,how){
  n += (u.st.shred||0);                            // Shred amplifier: take more from every source
  if((u.barrier||0)>0){                            // Barrier shields soak before HP
    const soak=Math.min(u.barrier,n); u.barrier-=soak; n-=soak;
    if(soak>0) log(`  ${u.name}'s Barrier absorbs ${soak}${u.barrier>0?` (${u.barrier} left)`:" — shattered"}.`,"l-miss");
  }
  if(n<=0) return;
  u.hp=Math.max(0,u.hp-n);
  if(u.hp===0 && !u.st.down){ u.st.down=true;
    log(`  ✖ ${u.name} is DOWNED (${how}).`, "l-bad"); }
}

/* ─── the Control check ───────────────────────────────────────────────────── */
function check(actor,target,bonusTags){
  let mod = actor.focus||0; const why=[`Focus +${actor.focus||0}`];
  if(target){
    if(target.st.slowed){ mod+=1; why.push("Slowed +1"); }
    if(target.st.stagger){ mod+=1; why.push("Staggered +1"); }
  }
  (bonusTags||[]).forEach(t=>{ mod+=t.n; why.push(`${t.name} ${t.n>0?"+":""}${t.n}`); });
  const r=roll2(); const total=r.sum+mod; const t=tier(total);
  log(`${actor.name} rolls ${r.a}+${r.b}=${r.sum} (${why.join(", ")}) → ${total}: ${t.toUpperCase()}`,
      t==="full"?"l-hit":t==="partial"?"l-part":"l-miss");
  return t;
}

/* ─── party actions ───────────────────────────────────────────────────────── */
function slam(actor,target){            // Cement: 10+ Rooted, 7-9 Slowed (teeth)
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  Cement Slam glances off ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,4,"Crushing"); setSt(target,"slowed",2);
    log(`  ${target.name} takes 4 + is Slowed (can't advance, −1 to hit).`,"l-part"); }
  else { damage(target,5,"Crushing"); setSt(target,"rooted",2);
    log(`  ${target.name} takes 5 + is ROOTED — pinned in place.`,"l-root"); }
  finishAction(actor);
}
function firebolt(actor,target){        // Pyro: 10+ dmg+Burning, 7-9 dmg only
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const bonus=[];
  if(p) bonus.push({name:"Push",n:1});
  if(S.fire[target.band]>0) bonus.push({name:"On-Fire zone",n:1});           // easier to ignite a burning target
  if(actor.affinity==="fire" && S.fire[actor.band]>0) bonus.push({name:"Stoked",n:1}); // firing from within the blaze
  const t=check(actor,target,bonus);
  if(t==="fail"){ log(`  Firebolt sputters past ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,3,"Fire");
    log(`  ${target.name} takes 3 Fire (no catch).`,"l-part"); }
  else { damage(target,4,"Fire"); setSt(target,"burning",2);
    log(`  ${target.name} takes 4 Fire and is BURNING (3/round).`,"l-fire"); }
  finishAction(actor);
}
function scorch(actor,band){            // Pyro: auto — set a band On-Fire
  S.push=false;                          // no roll to push on an auto action
  spend(actor,1);
  S.fire[band]=2;
  log(`${actor.name} sets the ${BANDS[band]} band ABLAZE — On-Fire for 2 rounds (3/round to anything standing in it).`,"l-fire");
  finishAction(actor);
}
function stanceToggle(actor){           // Metal Skin: enter/exit Stance:Metal (costs the action)
  actor.stance=!actor.stance;
  if(actor.stance) log(`${actor.name} turns to living metal — ARMORED (−2 to incoming hits, can't be Staggered), but Heavy (can't move) and it costs Strain each round.`,"l-root");
  else log(`${actor.name} sheds the metal — mobile again.`,"l-miss");
  finishAction(actor);
}
function taunt(actor){                   // the aggro: force the enemy group onto the tank
  spend(actor,1);
  setSt(actor,"taunting",2);
  log(`${actor.name} bellows a challenge — TAUNTING (2 rounds): every Raider must come for him.`,"l-root");
  finishAction(actor);
}
function sledge(actor,target){           // Metal Skin offense: Crushing + Stagger, harder in stance
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  ${actor.name}'s swing misses ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,4,"Crushing");
    log(`  ${target.name} takes 4 Crushing.`,"l-part"); }
  else { const d=actor.stance?6:5; damage(target,d,"Crushing"); setSt(target,"stagger",1);
    log(`  ${target.name} takes ${d} Crushing + Staggered.`,"l-hit"); }
  finishAction(actor);
}
function graft(actor,target){            // Regeneration support: heal an ally, or revive a Downed one
  spend(actor,2);
  if(!alive(target)){                     // revive (target.hp === 0)
    target.hp=6; target.st.down=false;
    log(`${actor.name} grafts living tissue into ${target.name} — REVIVED at 6 HP.`,"l-hit");
  } else {
    setSt(target,"regen",3);              // Regenerating: a signed DoT — heal 3/round for 3 rounds
    log(`${actor.name} knits ${target.name}'s wounds — Regenerating (3/round, 3 rounds).`,"l-hit");
  }
  finishAction(actor);
}
function mendSelf(actor){                 // Regeneration defense: turn the gift inward
  spend(actor,1);
  setSt(actor,"regen",3);
  log(`${actor.name} turns the gift inward — Regenerating (3/round, 3 rounds).`,"l-hit");
  finishAction(actor);
}
function rend(actor,target){             // Regeneration offense: Slashing + Bleeding (the bleed war)
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  ${actor.name}'s claws rake harmlessly off ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,3,"Slashing"); log(`  ${target.name} takes 3 Slashing.`,"l-part"); }
  else { damage(target,3,"Slashing"); setSt(target,"bleeding",3);
    log(`  ${target.name} takes 3 Slashing + is BLEEDING (2/round).`,"l-hit"); }
  finishAction(actor);
}
function haymaker(actor,target){         // Super Strength: Crushing + Knockback — forced movement
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  ${actor.name}'s haymaker whiffs past ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,4,"Crushing"); log(`  ${target.name} takes 4 Crushing.`,"l-part"); }
  else { damage(target,5,"Crushing");
    if(alive(target) && target.band<2 && !target.ctrlImmune){ target.band++;
      const fire = S.fire[target.band]>0 ? ` — KNOCKED into the fire at ${BANDS[target.band]}!` : ` — knocked back to ${BANDS[target.band]}.`;
      log(`  ${target.name} takes 5 Crushing${fire}`,"l-hit"); }
    else log(`  ${target.name} takes 5 Crushing${target.ctrlImmune?" (too heavy to knock back)":""}.`,"l-hit"); }
  finishAction(actor);
}
function hurl(actor,target){             // Super Strength: rip up debris and throw — ranged Crushing
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  ${actor.name}'s throw sails wide of ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,4,"Crushing"); log(`  ${target.name} takes 4 Crushing.`,"l-part"); }
  else { damage(target,6,"Crushing"); setSt(target,"stagger",1);
    log(`  ${target.name} takes 6 Crushing + Staggered by the impact.`,"l-hit"); }
  finishAction(actor);
}

/* ─── Team 2 actions ──────────────────────────────────────────────────────── */
function eventHorizon(actor){            // Gravity Anchor: open/close the Gravity Well at your band
  actor.well=!actor.well;
  if(actor.well){ S.well=actor.band;
    log(`${actor.name} opens a GRAVITY WELL at ${BANDS[actor.band]} — each round it drags enemies inward and crushes those caught (Heavy). Strain upkeep; can't move while held.`,"l-root"); }
  else { S.well=-1; log(`${actor.name} lets the well collapse — mobile again.`,"l-miss"); }
  finishAction(actor);
}
function crush(actor,target){            // Gravity Anchor: spike gravity — Crushing + pin
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  The gravity spike misses ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,4,"Crushing"); setSt(target,"heavy",1); log(`  ${target.name} takes 4 + is Heavy.`,"l-part"); }
  else { damage(target,6,"Crushing"); setSt(target,"rooted",2); log(`  ${target.name} takes 6 Crushing + is PINNED (Rooted).`,"l-root"); }
  finishAction(actor);
}
function strangle(actor,target){         // Overgrowth: Slashing + Entangled, seeds Overgrown
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  The vines miss ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,3,"Slashing"); setSt(target,"entangled",2); log(`  ${target.name} takes 3 + is Entangled.`,"l-part"); }
  else { damage(target,3,"Slashing"); setSt(target,"entangled",3); S.grown[target.band]=Math.max(S.grown[target.band],2);
    log(`  ${target.name} takes 3 + ENTANGLED; Overgrowth roots at ${BANDS[target.band]} (it spreads).`,"l-root"); }
  finishAction(actor);
}
function thicket(actor){                 // Overgrowth: grow Cover + Thorns at your band
  spend(actor,1);
  setSt(actor,"thorns",3);
  S.grown[actor.band]=Math.max(S.grown[actor.band],2);
  log(`${actor.name} raises a thorned thicket — Thorns (attackers bleed) + Overgrown at ${BANDS[actor.band]}.`,"l-root");
  finishAction(actor);
}
function flensingGale(actor,band){       // Glasstorm: band AoE — damage all enemies there + Shred
  spend(actor,1);
  const hit=liveEnemies().filter(e=>e.band===band);
  if(!hit.length){ log(`${actor.name}'s gale finds no one at ${BANDS[band]}.`,"l-miss"); finishAction(actor); return; }
  log(`${actor.name} looses a Flensing Gale across ${BANDS[band]}:`,"l-part");
  hit.forEach(e=>{ e.st.shred=Math.min(6,(e.st.shred||0)+1); damage(e,3,"Slashing");
    log(`  ${e.name} takes 3 + Shred ${e.st.shred} (takes +${e.st.shred} from all sources).`,"l-part"); });
  finishAction(actor);
}
function glassZone(actor,band){          // Glasstorm: lay a Glasstorm hazard on a band
  spend(actor,1);
  S.glass[band]=2;
  log(`${actor.name} whips a Glasstorm across ${BANDS[band]} — abrasion + Slow + Shred to anything caught, 2 rounds.`,"l-fire");
  finishAction(actor);
}
function aegis(actor,target){            // Radiance: Barrier shield on an ally (preventive HP)
  spend(actor,1);
  target.barrier=(target.barrier||0)+5;
  log(`${actor.name} shields ${target.name} — Barrier ${target.barrier} (soaks damage before HP).`,"l-hit");
  finishAction(actor);
}
function cleanse(actor,target){          // Radiance "Unmake": purge ALL tags (buffs + debuffs), heal per tag
  spend(actor,1);
  let removed=0;
  ["burning","bleeding","slowed","rooted","entangled","heavy","blinded","shred","stagger","regen","taunting","thorns"]
    .forEach(k=>{ if(target.st[k]){ target.st[k]=0; removed++; } });
  if((target.barrier||0)>0){ target.barrier=0; removed++; }
  if(target.stance){ target.stance=false; removed++; }
  if(target.well){ target.well=false; S.well=-1; removed++; }
  if(removed){
    let healed=0;
    if(alive(target)){ const b=target.hp; target.hp=Math.min(target.max,target.hp+removed*2); healed=target.hp-b; }
    log(`${actor.name} UNMAKES ${removed} tag${removed>1?"s":""} on ${target.name} — all magic stripped${healed?`, heals ${healed}`:""}.`,"l-hit");
  } else log(`${actor.name} finds no magic to unmake on ${target.name}.`,"l-miss");
  finishAction(actor);
}
function radiantLance(actor,target){     // Radiance: Light damage + Blind
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  The lance of light misses ${target.name}.`,"l-miss"); }
  else if(t==="partial"){ damage(target,3,"Light"); log(`  ${target.name} takes 3 Light.`,"l-part"); }
  else { damage(target,4,"Light"); setSt(target,"blinded",2); log(`  ${target.name} takes 4 Light + is Blinded.`,"l-hit"); }
  finishAction(actor);
}
function summonArms(actor,target){       // Blacksmith: strike with the chosen conjured weapon
  const w=(S.pending && S.pending.weapon) || "Glaive"; S.pending=null;
  const p=S.push; S.push=false;
  spend(actor,p?2:1);
  const t=check(actor,target,p?[{name:"Push",n:1}]:[]);
  if(t==="fail"){ log(`  ${actor.name}'s ${w} misses ${target.name}.`,"l-miss"); finishAction(actor); return; }
  const full=(t==="full");
  if(w==="Flameblade"){ damage(target,full?4:3,"Fire"); if(full){ setSt(target,"burning",2); log(`  Flameblade: 4 Fire + Burning.`,"l-fire"); } else log(`  Flameblade: 3 Fire.`,"l-part"); }
  else if(w==="Maul"){ damage(target,full?5:3,"Crushing"); if(full && alive(target) && target.band<2 && !target.ctrlImmune){ target.band++; log(`  Maul: 5 Crushing + knocked to ${BANDS[target.band]}.`,"l-hit"); } else log(`  Maul: ${full?5:3} Crushing.`,full?"l-hit":"l-part"); }
  else if(w==="Chain"){ damage(target,3,"Slashing"); setSt(target,full?"entangled":"slowed",2); log(`  Chain: 3 Slashing + ${full?"Entangled":"Slowed"}.`,full?"l-root":"l-part"); }
  else { damage(target,full?5:4,"Piercing"); log(`  Glaive: ${full?5:4} Piercing.`,full?"l-hit":"l-part"); }
  finishAction(actor);
}
function bulwarkArms(actor){             // Blacksmith: forge a guard — self Barrier
  spend(actor,1);
  actor.barrier=(actor.barrier||0)+5;
  log(`${actor.name} forges a tower shield — Barrier ${actor.barrier}.`,"l-hit");
  finishAction(actor);
}

/* ─── Signatures (capstones) — once per fight, high Strain ───────────────── */
function sigConflagration(actor){        // Pyro: detonate every flame
  spend(actor,4); actor.sigDone=true;
  log(`${actor.name} unleashes CONFLAGRATION — every flame on the field detonates!`,"l-fire");
  liveEnemies().forEach(e=>{ const lit=e.st.burning>0||S.fire[e.band]>0; damage(e,lit?6:3,"Conflagration"); setSt(e,"burning",2);
    log(`  ${e.name} takes ${lit?6:3} Fire${lit?" (was already burning!)":""} + Burning.`,"l-fire"); });
  finishAction(actor);
}
function sigMausoleum(actor,target){     // Cement: entomb one enemy (hard lock)
  spend(actor,4); actor.sigDone=true;
  damage(target,5,"Crushing"); setSt(target,"rooted",3); setSt(target,"suppressed",3);
  log(`${actor.name} entombs ${target.name} in cement — 5 Crushing, ROOTED + SUPPRESSED (can't act) for 3 rounds.`,"l-root");
  finishAction(actor);
}
function sigWreckingThrow(actor,target){ // Strength: bury one enemy under a car
  spend(actor,4); actor.sigDone=true;
  damage(target,10,"Crushing");
  const kb = (alive(target)&&target.band<2&&!target.ctrlImmune) ? (target.band++, " and hurled back") : "";
  log(`${actor.name} hurls a CAR at ${target.name} — 10 Crushing${kb}!`,"l-hit");
  finishAction(actor);
}
function sigLivingFortress(actor){       // Metal Skin: become an immovable bulwark + taunt all
  spend(actor,4); actor.sigDone=true; actor.stance=true;
  setSt(actor,"taunting",4); actor.barrier=(actor.barrier||0)+8;
  log(`${actor.name} becomes a LIVING FORTRESS — Armored, Barrier 8, Taunting the whole warband for 4 rounds.`,"l-root");
  finishAction(actor);
}
function sigUndying(actor){              // Regeneration: raise the fallen, mass regen
  spend(actor,4); actor.sigDone=true;
  party().forEach(u=>{ if(!alive(u)){ u.hp=8; u.st.down=false; log(`  ${u.name} rises — UNDYING (8 HP).`,"l-hit"); } setSt(u,"regen",3); });
  log(`${actor.name} channels UNDYING — fallen allies rise and the whole squad Regenerates.`,"l-hit");
  finishAction(actor);
}
function sigSingularity(actor){          // Gravity: yank the whole warband into one band
  spend(actor,4); actor.sigDone=true;
  const b=actor.band;
  liveEnemies().forEach(e=>{ if(!e.ctrlImmune){ e.band=b; setSt(e,"heavy",2); } damage(e,5,"the Singularity"); });
  log(`${actor.name} collapses a SINGULARITY at ${BANDS[b]} — the warband crushed into one point (5 + Heavy).`,"l-root");
  finishAction(actor);
}
function sigWorldroot(actor){            // Overgrowth: overgrow every band, entangle all
  spend(actor,4); actor.sigDone=true;
  S.grown=[3,3,3];
  liveEnemies().forEach(e=>{ damage(e,3,"Worldroot"); setSt(e,"entangled",3); });
  log(`${actor.name} erupts WORLDROOT — every band overgrown, the warband Entangled.`,"l-root");
  finishAction(actor);
}
function sigGlasstormSig(actor){         // Glasstorm: the full tempest
  spend(actor,4); actor.sigDone=true;
  S.glass=[3,3,3];
  liveEnemies().forEach(e=>{ e.st.shred=Math.min(8,(e.st.shred||0)+2); damage(e,4,"the Glasstorm"); setSt(e,"slowed",2); });
  log(`${actor.name} raises a full GLASSTORM — the field flayed: 4 + Shred ×2 + Slow on every foe.`,"l-fire");
  finishAction(actor);
}
function sigDayspring(actor){            // Radiance: mass shield + heal + sear
  spend(actor,4); actor.sigDone=true;
  party().forEach(u=>{ if(alive(u)){ u.barrier=(u.barrier||0)+5; u.hp=Math.min(u.max,u.hp+3); } });
  liveEnemies().forEach(e=>{ damage(e,3,"Light"); setSt(e,"blinded",2); });
  log(`${actor.name} calls the DAYSPRING — squad shielded (Barrier 5) & healed 3; the warband seared and Blinded.`,"l-hit");
  finishAction(actor);
}
function sigPanoply(actor){              // Blacksmith: a storm of conjured blades
  spend(actor,4); actor.sigDone=true;
  log(`${actor.name} unleashes the PANOPLY — a storm of conjured blades:`,"l-hit");
  liveEnemies().forEach(e=>{ const ty=["Fire","Crushing","Slashing","Piercing"][Math.floor(Math.random()*4)];
    damage(e,4,ty); if(ty==="Fire") setSt(e,"burning",1); if(ty==="Slashing") setSt(e,"bleeding",2);
    log(`  ${e.name} takes 4 ${ty}.`,"l-part"); });
  finishAction(actor);
}

function spend(actor,n){
  actor.strain+=n;
  if(actor.strain>actor.resolve){              // Backlash
    actor.strain=actor.resolve;
    setSt(actor,"stagger",1);
    log(`  ⚠ ${actor.name} pushes past Resolve — BACKLASH, Staggered (loses next action).`,"l-bad");
  }
}
function setSt(u,k,n){
  if(u.ctrlImmune && (k==="rooted"||k==="heavy"||k==="entangled"||k==="slowed"||k==="stagger"||k==="suppressed")){
    log(`  ${u.name} shrugs off ${k} (immune to control).`,"l-miss"); return;
  }
  u.st[k]=Math.max(u.st[k]||0,n);
}

/* ─── turn flow ───────────────────────────────────────────────────────────── */
function activeActor(){ return party().find(u=>alive(u)&&!u.acted) || null; }

function finishAction(actor){
  actor.acted=true;
  S.pending=null; S.push=false;
  if(checkEnd()) return;                                       // win/lose the instant it lands — don't stall
  promptParty();
}
// Advance to the next party member, auto-skipping the Staggered (from Backlash or enemy hits).
function promptParty(){
  let a;
  while((a=activeActor()) && a.st.stagger){
    a.st.stagger=0; a.acted=true;
    log(`${a.name} is Staggered — loses the action.`,"l-bad");
  }
  if(!activeActor()){ render(); setTimeout(enemyTurn,450); }   // party done → enemies
  else render();
}
// End the fight the moment a side is wiped, whoever's "turn" it nominally is.
// (end-of-round still backstops deaths from DoTs and the doom clock.)
function checkEnd(){
  if(S.over) return true;
  if(!liveEnemies().length){ finish("win"); return true; }
  if(!liveParty().length){ finish("lose","Your party is down."); return true; }
  return false;
}

function move(actor,dir){               // dir -1 advance, +1 retreat
  if(actor.moved) return;
  if(actor.stance){ log(`${actor.name} is too Heavy in metal to reposition.`,"l-miss"); render(); return; }
  if(actor.well){ log(`${actor.name} is anchoring the well — can't move while it's open.`,"l-miss"); render(); return; }
  actor.band=Math.min(2,Math.max(0,actor.band+dir));
  actor.moved=true;
  log(`${actor.name} moves to ${BANDS[actor.band]}.`,"l-miss");
  render();
}

function enemyTurn(){
  S.phase="enemy";
  liveEnemies().forEach(e=>{
    if(e.st.stagger){ e.st.stagger=0; log(`${e.name} is Staggered — fumbles its turn.`,"l-miss"); return; }
    if(e.st.suppressed){ e.st.suppressed--; log(`${e.name} is entombed (Suppressed) — can't act.`,"l-root"); return; }
    if(e.role==="ranged"){ enemyAttack(e); return; }     // Marauder: fires from any range, never needs to close
    if(e.role==="disruptor"){ disrupt(e); return; }       // Disruptor: strips a buff instead of attacking
    if(e.st.rooted || e.st.entangled || e.st.heavy){    // pinned: can't advance, only attacks if already Engaged
      const why = e.st.rooted?"Rooted":e.st.entangled?"Entangled":"Heavy";
      if(e.band===0) enemyAttack(e);
      else log(`${e.name} is pinned (${why}) — can't advance.`,"l-root");
      return;
    }
    if(e.st.slowed){                    // teeth: Slowed costs the advance
      if(e.band===0) enemyAttack(e);
      else log(`${e.name} is Slowed — loses ground it wanted to gain (stays at ${BANDS[e.band]}).`,"l-part");
      return;
    }
    if(e.band>0){ e.band--; log(`${e.name} advances to ${BANDS[e.band]}.`,"l-miss"); }
    else enemyAttack(e);
  });
  render();
  setTimeout(endOfRound,550);
}
function enemyAttack(e){
  let targets=liveParty(); if(!targets.length) return;
  let taunter=null;
  if(e.role!=="ranged"){                              // ranged shoots past the front — ignores taunt & the well
    taunter=targets.find(u=>u.st.taunting);
    if(taunter) targets=[taunter];
    else if(S.well>=0 && e.band===S.well){            // gravity aggro: dragged into the well = swing at the anchor
      const owner=S.units.find(u=>alive(u)&&u.well); if(owner) targets=[owner];
    }
  }
  const tgt=targets[Math.floor(Math.random()*targets.length)];
  let mod=0; if(e.st.slowed) mod-=1; if(e.st.blinded) mod-=1;   // Blinded enemies aim worse (trimmed from -2)
  const r=roll2(); const total=r.sum+mod; const t=tier(total);
  const verb = e.role==="ranged" ? "fires at" : "swings at";
  log(`${e.name} ${verb} ${tgt.name}${taunter?" (taunted)":""}: ${r.a}+${r.b}=${r.sum}${mod?` ${mod}`:""} → ${total}: ${t.toUpperCase()}`,
      t==="full"?"l-bad":t==="partial"?"l-part":"l-miss");
  const soak = d => tgt.stance ? Math.max(1,d-2) : d;  // Armored: living metal sheds 2 off each hit
  const big = e.role==="brute" ? 2 : 0;               // the Brute hits hard
  if(t==="fail"){ log(`  ${tgt.name} ${e.role==="ranged"?"ducks the shot":"slips the blow"}.`,"l-miss"); }
  else if(t==="partial"){ const d=soak(3+big); damage(tgt,d,"a glancing hit");
    log(`  ${tgt.name} takes ${d}${tgt.stance?" (Armored)":""}.`,"l-part"); }
  else { const d=soak(4+big); damage(tgt,d,"a solid hit");
    if(!tgt.stance) setSt(tgt,"stagger",1);            // metal can't be Staggered
    log(`  ${tgt.name} takes ${d}${tgt.stance?" (Armored, unshaken)":" and is Staggered"}.`,"l-bad"); }
  if((t==="full"||t==="partial") && tgt.st.thorns && e.role!=="ranged"){ damage(e,2,"thorns"); log(`  ${e.name} is torn on ${tgt.name}'s thorns: 2.`,"l-part"); }
}
function disrupt(e){                                   // Disruptor: strip a buff instead of attacking
  const buffed=liveParty().filter(u=>(u.barrier||0)>0||u.stance||u.well||u.st.taunting||u.st.regen);
  if(buffed.length){
    const t=buffed[Math.floor(Math.random()*buffed.length)];
    if((t.barrier||0)>0){ t.barrier=0; log(`${e.name} unweaves ${t.name}'s Barrier — shattered.`,"l-bad"); }
    else if(t.stance){ t.stance=false; log(`${e.name} disrupts ${t.name}'s Metal stance — dropped.`,"l-bad"); }
    else if(t.well){ t.well=false; S.well=-1; log(`${e.name} destabilizes ${t.name}'s gravity well — collapsed.`,"l-bad"); }
    else if(t.st.taunting){ t.st.taunting=0; log(`${e.name} breaks ${t.name}'s Taunt.`,"l-bad"); }
    else if(t.st.regen){ t.st.regen=0; log(`${e.name} severs ${t.name}'s Regeneration.`,"l-bad"); }
  } else {
    const tgt=liveParty()[Math.floor(Math.random()*liveParty().length)];
    if(tgt){ damage(tgt,2,"a warping bolt"); log(`${e.name} finds nothing to unmake — hurls a warping bolt at ${tgt.name}: 2.`,"l-part"); }
  }
}

function endOfRound(){
  log("— end of round —","l-round");
  // a. Signed DoTs — one engine: Burning/Bleeding tick HP down, Regenerating ticks it up.
  S.units.filter(alive).forEach(u=>{
    if(u.st.burning){
      if(u.affinity==="fire"){ u.st.burning=0; }     // the flames can't burn the firestarter
      else { damage(u,3,"Burning"); log(`  ${u.name} burns for 3.`,"l-fire"); }
    }
    if(u.st.bleeding){ damage(u,2,"Bleeding"); log(`  ${u.name} bleeds for 2.`,"l-bad"); }
    if(u.st.regen){
      // Cauterized: fire (a Burning tag, or standing in an On-Fire band) sears wounds shut → no heal
      const cauterized = u.st.burning>0 || (S.fire[u.band]>0 && u.affinity!=="fire");
      if(cauterized){ log(`  ${u.name}'s wounds are Cauterized by fire — Regenerating suppressed.`,"l-fire"); }
      else { const b=u.hp; u.hp=Math.min(u.max,u.hp+3);
        if(u.hp>b) log(`  ${u.name} regenerates ${u.hp-b}.`,"l-hit"); }
    }
  });
  // b. On-Fire zones (the combo: a Rooted unit can't leave the band it's cooking in)
  S.units.filter(alive).forEach(u=>{
    if(S.fire[u.band]>0){
      if(u.affinity==="fire"){
        log(`  ${u.name} stands in the blaze at ${BANDS[u.band]} — Stoked, not burned.`,"l-fire"); return; }
      damage(u,3,"the On-Fire zone");
      const pin = u.st.rooted ? " — Rooted, nowhere to run" : "";
      log(`  ${u.name} stands in fire at ${BANDS[u.band]}: 3${pin}.`,"l-fire"); }
  });
  // b2. Gravity Well — drag enemies inward, then crush + Heavy those caught
  if(S.well>=0){
    liveEnemies().forEach(e=>{
      if(e.band!==S.well && !e.st.rooted && !e.ctrlImmune){ e.band += (e.band>S.well ? -1 : 1);
        log(`  ${e.name} is dragged toward the well, now ${BANDS[e.band]}.`,"l-root"); }
    });
    liveEnemies().filter(e=>e.band===S.well).forEach(e=>{ damage(e,3,"the Gravity Well"); setSt(e,"heavy",1);
      log(`  ${e.name} is crushed in the well at ${BANDS[S.well]}: 3 + Heavy.`,"l-root"); });
  }
  // b3. Glasstorm zones — abrade + Slow + Blind + Shred
  S.glass.forEach((n,b)=>{ if(n>0){
    liveEnemies().filter(e=>e.band===b).forEach(e=>{ e.st.shred=Math.min(6,(e.st.shred||0)+1);
      damage(e,2,"the Glasstorm"); setSt(e,"slowed",1);   // Blind removed — was stacking into auto-miss
      log(`  ${e.name} is flayed in the Glasstorm at ${BANDS[b]}: 2 + Slow + Shred ${e.st.shred}.`,"l-fire"); });
  }});
  // b4. Overgrown zones — grip occupants, then age + spread a tendril to each neighbour
  { const next=[0,0,0];
    S.grown.forEach((n,b)=>{ if(n>0){
      liveEnemies().filter(e=>e.band===b).forEach(e=>{ damage(e,2,"Overgrowth"); setSt(e,"entangled",1);
        log(`  ${e.name} is gripped by Overgrowth at ${BANDS[b]}: 2 + Entangled.`,"l-root"); });
      if(n-1>0) next[b]=Math.max(next[b],n-1);
      if(n>=2){ [b-1,b+1].forEach(nb=>{ if(nb>=0&&nb<3) next[nb]=Math.max(next[nb],1); }); } // only vigorous growth spreads, then it fades
    }});
    S.grown=next;
  }
  // c. upkeep — Metal stance AND Gravity Well bleed Strain each round; can't pay = it drops
  S.units.filter(alive).forEach(u=>{
    if(u.stance || u.well){ u.strain++;
      if(u.strain>u.resolve){ u.strain=u.resolve;
        if(u.stance){ u.stance=false; log(`  ${u.name} can't sustain the metal — it sloughs off.`,"l-bad"); }
        if(u.well){ u.well=false; S.well=-1; log(`  ${u.name} can't hold the well — it collapses.`,"l-bad"); }
      } else log(`  ${u.name} sustains (Strain ${u.strain}/${u.resolve}).`,"l-miss"); }
  });
  if(S.well>=0 && !S.units.some(u=>alive(u)&&u.well)) S.well=-1;   // collapse if its owner fell
  // d. tick durations (stagger consumed on use) + zone countdowns
  S.fire=S.fire.map(n=>Math.max(0,n-1));
  S.glass=S.glass.map(n=>Math.max(0,n-1));
  S.units.forEach(u=>{ if(u.barrier>0) u.barrier=Math.floor(u.barrier/2); });   // shields erode — re-cast to keep one up
  S.units.forEach(u=>{ ["rooted","slowed","burning","taunting","bleeding","regen","heavy","entangled","blinded","shred","thorns"].forEach(k=>{
    if(u.st[k]) u.st[k]--; }); });

  // win/lose
  if(!liveEnemies().length){ return finish("win"); }
  if(!liveParty().length){ return finish("lose","Your party is down."); }
  S.doom--;
  if(S.doom<=0){ return finish("lose","The doom clock ran out — reinforcements arrive."); }

  // next round
  S.round++; S.phase="party";
  S.units.forEach(u=>{ u.acted=false; u.moved=false; });
  promptParty();
}

function finish(result,why){
  S.over=result;
  if(result==="win") log(`★ VICTORY — the Raiders are down, doom at ${S.doom}.`,"l-hit");
  else log(`☠ DEFEAT — ${why}`,"l-bad");
  render();
}

/* ─── render ──────────────────────────────────────────────────────────────── */
function unitCard(u){
  const tgtable = S.pending && (
    (S.pending.targets==="enemy" && u.side==="enemy" && alive(u)) ||
    (S.pending.targets==="ally"  && u.side==="party")          // includes Downed allies (for revive)
  );
  const cls=["card",u.side==="party"?"party":"enemy"];
  if(!alive(u)) cls.push("down");
  if(S.phase==="party" && !S.over && activeActor()===u) cls.push("active");
  if(tgtable) cls.push("targetable");
  const chips=[];
  if(alive(u)){
    if(u.st.rooted)  chips.push(chip("rooted",`Rooted ${u.st.rooted}`,"Rooted — can't move or flee. Still attacks if already Engaged."));
    if(u.st.slowed)  chips.push(chip("slowed",`Slowed ${u.st.slowed}`,"Slowed — loses its advance this turn and takes −1 to attacks."));
    if(u.st.burning) chips.push(chip("burning",`Burning ${u.st.burning}`,"Burning — 3 fire damage at end of round. (Fire-affinity units are immune.)"));
    if(u.st.stagger) chips.push(chip("stagger","Staggered","Staggered — loses its next action."));
    if(u.stance)     chips.push(chip("armor","⛨ Metal · Armored","Stance: Metal — −2 to every incoming hit and immune to Stagger, but Heavy (can't move) and costs Strain each round."));
    if(u.st.taunting)chips.push(chip("taunt",`⚑ Taunting ${u.st.taunting}`,"Taunting — every enemy must attack this unit."));
    if(u.st.regen)   chips.push(chip("regen",`✚ Regenerating ${u.st.regen}`,"Regenerating — heals 3 HP at end of round. Suppressed (Cauterized) while Burning or standing in fire."));
    if(u.st.bleeding)chips.push(chip("bleed",`🩸 Bleeding ${u.st.bleeding}`,"Bleeding — 2 damage at end of round."));
    if(u.st.heavy)   chips.push(chip("rooted",`⬇ Heavy ${u.st.heavy}`,"Heavy — pinned by gravity; can't advance."));
    if(u.st.entangled)chips.push(chip("rooted",`🌿 Entangled ${u.st.entangled}`,"Entangled — gripped by vines; can't move."));
    if(u.st.suppressed)chips.push(chip("rooted",`⛓ Suppressed ${u.st.suppressed}`,"Suppressed — entombed in cement; can't act at all."));
    if(u.st.blinded) chips.push(chip("slowed",`😵 Blinded ${u.st.blinded}`,"Blinded — −1 to this unit's attack rolls."));
    if(u.st.shred)   chips.push(chip("bleed",`◈ Shred ${u.st.shred}`,`Shred — takes +${u.st.shred} damage from EVERY source. Stacks; fades 1/round.`));
    if(u.st.thorns)  chips.push(chip("regen",`❧ Thorns ${u.st.thorns}`,"Thorns — anyone who hits this unit takes 2 damage back."));
    if((u.barrier||0)>0) chips.push(chip("armor",`◇ Barrier ${u.barrier}`,`Barrier — absorbs the next ${u.barrier} damage before HP is touched.`));
    if(S.fire[u.band]>0) chips.push(u.affinity==="fire"
      ? chip("stoked","🔥 Stoked +1","Standing in fire — immune to it, and +1 to fire attacks (fire affinity).")
      : chip("fire","🔥 in fire","Standing in an On-Fire band — 3 fire damage at end of round."));
    if(S.well===u.band)   chips.push(chip("rooted","🌀 in the well","Gravity Well — dragged toward the anchor and crushed (3 + Heavy) each round."));
    if(S.grown[u.band]>0) chips.push(chip("regen","🌿 overgrown","Overgrown band — enemies here take 2 + Entangled each round; it spreads to nearby bands."));
    if(S.glass[u.band]>0) chips.push(chip("bleed","◈ glasstorm","Glasstorm band — 2 damage + Slow + Shred each round."));
  } else chips.push(chip("","Downed","Downed — out of the fight. A medic (Wren's Graft) can revive."));
  const click = tgtable ? `onclick="pick('${u.id}')"` : "";
  const nameTip = u.side==="enemy" ? ` title="${enemyTip(u.role)}"` : "";
  return `<div class="${cls.join(" ")}" ${click}>
    <span class="band">${alive(u)?BANDS[u.band]:"—"}</span>
    <div class="name"${nameTip}>${u.name} <small>· ${u.role}</small></div>
    <div class="hpwrap"><div class="hp" style="width:${100*u.hp/u.max}%"></div></div>
    <div class="hpnum">HP ${u.hp}/${u.max}${u.side==="party"?` · Strain ${u.strain}/${u.resolve}`:""}</div>
    <div class="chips">${chips.join("")}</div>
  </div>`;
}

function render(){
  document.getElementById("doom").textContent=S.doom;
  document.getElementById("round").textContent=S.round;
  document.getElementById("teamlabel").textContent=S.team;
  document.getElementById("doompips").textContent="◆".repeat(Math.max(0,S.doom));
  document.getElementById("party").innerHTML  = party().map(unitCard).join("");
  document.getElementById("enemies").innerHTML= enemies().map(unitCard).join("");

  const head=document.getElementById("ctrlhead");
  const acts=document.getElementById("acts");
  const hint=document.getElementById("hint");
  acts.innerHTML=""; hint.textContent="";

  if(S.over){
    head.innerHTML=`<span class="win ${S.over==="win"?"w":"l"}">${S.over==="win"?"Victory":"Defeat"}</span>`;
    acts.innerHTML=`<button class="primary" onclick="newGame(S.team)">New fight</button>`
      +`<button onclick="newGame(S.team===1?2:1)">Try Team ${S.team===1?2:1}</button>`;
    return;
  }
  if(S.phase!=="party"){ head.textContent="Raiders are acting…"; return; }

  const a=activeActor();
  if(!a){ head.textContent="…"; return; }
  head.innerHTML=`${a.name}'s turn <small style="color:var(--dim)">· ${BANDS[a.band]} · Strain ${a.strain}/${a.resolve}</small>`;

  if(S.pending){
    const pt=S.pending.type;
    if(pt==="scorch"||pt==="gale"||pt==="glasszone"){
      hint.textContent = pt==="gale" ? "Choose a band to sweep with glass (hits every Raider there):"
        : pt==="glasszone" ? "Choose a band to engulf in a lingering Glasstorm:"
        : "Choose a band to set on fire:";
      acts.innerHTML=BANDS.map((bd,i)=>`<button onclick="pickBand(${i})">${bd}${zoneMark(i)}</button>`).join("")
        +`<button class="ghost" onclick="cancel()">cancel</button>`;
    } else if(pt==="summon" && S.pending.weaponPick){
      hint.textContent="Forge a weapon to strike with:";
      acts.innerHTML=["Flameblade","Maul","Chain","Glaive"].map(w=>`<button onclick="pickWeapon('${w}')">${w}</button>`).join("")
        +`<button class="ghost" onclick="cancel()">cancel</button>`;
    } else {
      hint.textContent= pt==="slam" ? "Click a Raider at Engaged or Near to Slam."
        : pt==="sledge" ? "Click a Raider at Engaged or Near to Sledge."
        : pt==="rend" ? "Click a Raider at Engaged or Near to Rend."
        : pt==="haymaker" ? "Click a Raider at Engaged or Near to Haymaker (knocks it back a band)."
        : pt==="hurl" ? "Click any Raider to Hurl debris at."
        : pt==="graft" ? "Click an ally to heal — or a Downed ally to revive."
        : pt==="crush" ? "Click any Raider to Crush (gravity reaches every band)."
        : pt==="strangle" ? "Click any Raider to Strangle with vines."
        : pt==="lance" ? "Click any Raider to lance with light."
        : pt==="aegis" ? "Click an ally to shield with a Barrier."
        : pt==="cleanse" ? "Click an ally to Unmake — purge ALL their tags (buffs & debuffs), heal 2 per tag."
        : pt==="summon" ? `Click a Raider at Engaged or Near to strike with the ${S.pending.weapon}.`
        : pt==="mausoleum" ? "Click any Raider to entomb in cement (hard lock — can't act)."
        : pt==="wreck" ? "Click any Raider to bury under a Wrecking Throw (10 Crushing)."
        : "Click any Raider to Firebolt.";
      acts.innerHTML=`<button class="ghost" onclick="cancel()">cancel</button>`;
    }
    return;
  }

  // action menu for the active party member
  const b=[];
  if(a.role==="Cement"){
    b.push(btn("Cement Slam","arm('slam')",false,TIPS.slam));
    b.push(btn("★ Mausoleum","arm('mausoleum')", a.sigDone, TIPS.mausoleum));
  } else if(a.role==="Pyro"){
    b.push(btn("Firebolt","arm('fire')",false,TIPS.fire));
    b.push(btn("Scorch (zone)","arm('scorch')",false,TIPS.scorch));
    b.push(btn("★ Conflagration",`sigConflagration(U('${a.id}'))`, a.sigDone, TIPS.conflagration));
  } else if(a.role==="Metal"){
    b.push(`<button class="${a.stance?"primary":""}" title="${TIPS.stance}" onclick="stanceToggle(U('${a.id}'))">${a.stance?"Drop Metal":"Stance: Metal"}</button>`);
    b.push(btn("Taunt", `taunt(U('${a.id}'))`, a.st.taunting>0, TIPS.taunt));
    b.push(btn("Sledge","arm('sledge')",false,TIPS.sledge));
    b.push(btn("★ Living Fortress",`sigLivingFortress(U('${a.id}'))`, a.sigDone, TIPS.livingFortress));
  } else if(a.role==="Regen"){
    b.push(btn("Graft (heal / revive)","arm('graft')",false,TIPS.graft));
    b.push(btn("Mend Self",`mendSelf(U('${a.id}'))`,false,TIPS.mendSelf));
    b.push(btn("Rend","arm('rend')",false,TIPS.rend));
    b.push(btn("★ Undying",`sigUndying(U('${a.id}'))`, a.sigDone, TIPS.undying));
  } else if(a.role==="Physical"){
    b.push(btn("Haymaker (knockback)","arm('haymaker')",false,TIPS.haymaker));
    b.push(btn("Hurl Debris","arm('hurl')",false,TIPS.hurl));
    b.push(btn("★ Wrecking Throw","arm('wreck')", a.sigDone, TIPS.wreck));
  } else if(a.role==="Gravity"){
    b.push(`<button class="${a.well?"primary":""}" title="${TIPS.eventHorizon}" onclick="eventHorizon(U('${a.id}'))">${a.well?"Collapse Well":"Event Horizon"}</button>`);
    b.push(btn("Crush","arm('crush')",false,TIPS.crush));
    b.push(btn("★ Singularity",`sigSingularity(U('${a.id}'))`, a.sigDone, TIPS.singularity));
  } else if(a.role==="Overgrowth"){
    b.push(btn("Strangle","arm('strangle')",false,TIPS.strangle));
    b.push(btn("Thicket",`thicket(U('${a.id}'))`,false,TIPS.thicket));
    b.push(btn("★ Worldroot",`sigWorldroot(U('${a.id}'))`, a.sigDone, TIPS.worldroot));
  } else if(a.role==="Glass"){
    b.push(btn("Flensing Gale","arm('gale')",false,TIPS.gale));
    b.push(btn("Glasstorm (zone)","arm('glasszone')",false,TIPS.glasszone));
    b.push(btn("★ Glasstorm!",`sigGlasstormSig(U('${a.id}'))`, a.sigDone, TIPS.glasstormSig));
  } else if(a.role==="Radiance"){
    b.push(btn("Aegis (shield)","arm('aegis')",false,TIPS.aegis));
    b.push(btn("Unmake (purge + heal)","arm('cleanse')",false,TIPS.cleanse));
    b.push(btn("Radiant Lance","arm('lance')",false,TIPS.lance));
    b.push(btn("★ Dayspring",`sigDayspring(U('${a.id}'))`, a.sigDone, TIPS.dayspring));
  } else if(a.role==="Smith"){
    b.push(btn("Summon Arms","arm('summon')",false,TIPS.summon));
    b.push(btn("Bulwark (shield)",`bulwarkArms(U('${a.id}'))`,false,TIPS.bulwark));
    b.push(btn("★ Panoply",`sigPanoply(U('${a.id}'))`, a.sigDone, TIPS.panoply));
  }
  b.push(btn("◀ Advance",`move(U('${a.id}'),-1)`, a.moved||a.band===0||a.stance||a.well, TIPS.advance));
  b.push(btn("Retreat ▶",`move(U('${a.id}'),1)`,  a.moved||a.band===2||a.stance||a.well, TIPS.retreat));
  b.push(`<button class="${S.push?"primary":"ghost"}" onclick="togglePush()" title="${TIPS.push}">Push ${S.push?"ON":"OFF"} · +1 / +1 Strain</button>`);
  b.push(`<button class="ghost" onclick="passTurn()" title="${TIPS.skip}">Skip action</button>`);
  acts.innerHTML=b.join("");
  hint.textContent=a.role==="Metal"
    ? "Tank line: Stance: Metal to armor up, then Taunt to pull the Raiders onto you — the others work free while you soak."
    : a.role==="Regen"
    ? "Medic line: Graft a Regenerating heal onto the tank (or revive a Downed ally). Keep the healer out of fire — it Cauterizes regen."
    : a.role==="Physical"
    ? "Striker line: Haymaker knocks a Raider back a band — into a fire to cook it, or off your line to buy time. Hurl Debris for ranged burst."
    : a.role==="Gravity"
    ? "Tank line: Event Horizon opens a well that drags Raiders onto you and crushes them each round (you can't move while it's up). Crush to pin one."
    : a.role==="Overgrowth"
    ? "Controller: Strangle Entangles a Raider and seeds Overgrowth (it spreads to nearby bands). Thicket guards you with Thorns."
    : a.role==="Glass"
    ? "Artillery: Flensing Gale rakes a whole band + stacks Shred (they take MORE from everything). Glasstorm lays a lingering hazard."
    : a.role==="Radiance"
    ? "Support: Aegis shields an ally (Barrier soaks before HP), Unmake purges ALL an ally's tags and heals 2 per tag (clears debuffs — but their buffs too), Radiant Lance burns + Blinds."
    : a.role==="Smith"
    ? "Striker: Summon Arms — forge the weapon for the moment (Flameblade/Maul/Chain/Glaive). Bulwark forges a shield for yourself."
    : "Tip: gather the Raiders into one band, hold them there, and reap them.";
}
function btn(label,fn,dis,tip){ return `<button ${dis?"disabled":""}${tip?` title="${tip}"`:""} onclick="${fn}">${label}</button>`; }
const TIPS = {
  // Team 1
  slam:"Cement Slam — 1 Strain. Engaged/Near. 10+: 5 Crushing + Rooted; 7–9: 4 + Slowed.",
  fire:"Firebolt — 1 Strain. Any range. 10+: 4 Fire + Burning; 7–9: 3 Fire.",
  scorch:"Scorch — 1 Strain. Sets a chosen band On-Fire (3/round, 2 rounds). Ember is immune + Stoked in it.",
  stance:"Stance: Metal — costs the action + 1 Strain/round. Armored (−2 to hits, can't be Staggered) but Heavy (can't move).",
  taunt:"Taunt — 1 Strain. Forces every enemy to attack this unit for 2 rounds.",
  sledge:"Sledge — 1 Strain. Engaged/Near. 10+: 5 Crushing (6 in stance) + Stagger; 7–9: 4.",
  graft:"Graft — 2 Strain. Heal an ally (Regenerating 3/round ×3), or revive a Downed ally to 6 HP.",
  mendSelf:"Mend Self — 1 Strain. Regenerating on yourself (3/round ×3).",
  rend:"Rend — 1 Strain. Engaged/Near. 10+: 3 Slashing + Bleeding; 7–9: 3 Slashing.",
  haymaker:"Haymaker — 1 Strain. Engaged/Near. 10+: 5 Crushing + Knockback (a band away); 7–9: 4.",
  hurl:"Hurl Debris — 1 Strain. Any range. 10+: 6 Crushing + Stagger; 7–9: 4.",
  // Team 2
  eventHorizon:"Event Horizon — costs the action + 1 Strain/round. Opens a Gravity Well: drags enemies inward & crushes them each round. Can't move while held.",
  crush:"Crush — 1 Strain. Any range. 10+: 6 Crushing + Rooted; 7–9: 4 + Heavy.",
  strangle:"Strangle — 1 Strain. Any range. 10+: 3 Slashing + Entangled + seeds spreading Overgrowth; 7–9: 3 + Entangled.",
  thicket:"Thicket — 1 Strain. Thorns on yourself (attackers take 2) + Overgrowth at your band.",
  gale:"Flensing Gale — 1 Strain. Pick a band: 3 to every enemy there + a Shred stack (they take more from all sources).",
  glasszone:"Glasstorm (zone) — 1 Strain. Lays a hazard on a band: 2 + Slow + Shred each round, 2 rounds.",
  aegis:"Aegis — 1 Strain. Barrier on an ally (soaks 5 damage before HP; halves each round).",
  cleanse:"Unmake — 1 Strain. Strip ALL tags off a target (buffs + debuffs) and heal 2 per tag removed.",
  lance:"Radiant Lance — 1 Strain. Any range. 10+: 4 Light + Blinded; 7–9: 3 Light.",
  summon:"Summon Arms — 1 Strain. Engaged/Near. Forge a weapon: Flameblade (Fire), Maul (knockback), Chain (Entangle), Glaive (pierce).",
  bulwark:"Bulwark — 1 Strain. Forge a shield for yourself (Barrier 4).",
  // Signatures (★ once per fight, 4 Strain)
  mausoleum:"★ Mausoleum (4 Strain · once/fight) — entomb an enemy: 5 Crushing + Suppressed (can't act) + Rooted, 3 rounds.",
  conflagration:"★ Conflagration (4 Strain · once/fight) — detonate every flame: 6 to already-burning foes, 3 to the rest, all Burning.",
  livingFortress:"★ Living Fortress (4 Strain · once/fight) — Armored + Barrier 8 + Taunt the whole warband, 4 rounds.",
  undying:"★ Undying (4 Strain · once/fight) — revive every fallen ally (8 HP) + Regenerating on the whole squad.",
  wreck:"★ Wrecking Throw (4 Strain · once/fight) — 10 Crushing + Knockback to one enemy.",
  singularity:"★ Singularity (4 Strain · once/fight) — drag the whole warband into your band: 5 Crushing + Heavy.",
  worldroot:"★ Worldroot (4 Strain · once/fight) — overgrow every band + Entangle every enemy (3 damage).",
  glasstormSig:"★ Glasstorm (4 Strain · once/fight) — field-wide storm: 4 + Shred ×2 + Slow to every enemy.",
  dayspring:"★ Dayspring (4 Strain · once/fight) — mass Barrier 5 + heal 3 to allies; 3 Light + Blind to all enemies.",
  panoply:"★ Panoply (4 Strain · once/fight) — a storm of blades: 4 mixed-type damage to every enemy.",
  // generic
  advance:"Move toward Engaged — free (doesn't use your action).",
  retreat:"Move toward Far — free (doesn't use your action).",
  push:"Push — toggle. Your next check spends +1 Strain for +1 to the roll.",
  skip:"Skip this character's action.",
};
function chip(cls,label,tip){ return `<span class="chip ${cls}" title="${tip}">${label}</span>`; }
function enemyTip(role){
  return role==="ranged" ? "Marauder — fires from any range; ignores taunts and the gravity well (shoots past your front line). Squishy: focus it down."
    : role==="brute" ? "Brute — IMMUNE to pulls, knockback, and pinning (Root/Heavy/Entangle/Slow). The gather-and-hold combo fails on it; out-damage it (Shred still works)."
    : role==="disruptor" ? "Disruptor — each turn it strips a buff (Barrier / stance / well / Taunt / Regen) instead of attacking."
    : "Raider — basic melee; advances to Engaged, then attacks.";
}

/* ─── input plumbing ──────────────────────────────────────────────────────── */
function arm(kind){
  const a=activeActor(); if(!a) return;
  if(kind==="slam")   S.pending={type:"slam",actor:a.id,targets:"enemy"};
  if(kind==="fire")   S.pending={type:"fire",actor:a.id,targets:"enemy"};
  if(kind==="scorch") S.pending={type:"scorch",actor:a.id};
  if(kind==="sledge") S.pending={type:"sledge",actor:a.id,targets:"enemy"};
  if(kind==="rend")   S.pending={type:"rend",actor:a.id,targets:"enemy"};
  if(kind==="graft")  S.pending={type:"graft",actor:a.id,targets:"ally"};
  if(kind==="haymaker") S.pending={type:"haymaker",actor:a.id,targets:"enemy"};
  if(kind==="hurl")   S.pending={type:"hurl",actor:a.id,targets:"enemy"};
  if(kind==="crush")    S.pending={type:"crush",actor:a.id,targets:"enemy"};
  if(kind==="strangle") S.pending={type:"strangle",actor:a.id,targets:"enemy"};
  if(kind==="gale")     S.pending={type:"gale",actor:a.id};
  if(kind==="glasszone")S.pending={type:"glasszone",actor:a.id};
  if(kind==="aegis")    S.pending={type:"aegis",actor:a.id,targets:"ally"};
  if(kind==="cleanse")  S.pending={type:"cleanse",actor:a.id,targets:"ally"};
  if(kind==="lance")    S.pending={type:"lance",actor:a.id,targets:"enemy"};
  if(kind==="summon")   S.pending={type:"summon",actor:a.id,weaponPick:true};
  if(kind==="mausoleum")S.pending={type:"mausoleum",actor:a.id,targets:"enemy"};
  if(kind==="wreck")    S.pending={type:"wreck",actor:a.id,targets:"enemy"};
  render();
}
function cancel(){ S.pending=null; render(); }
function pickBand(i){
  if(!S.pending) return; const a=U(S.pending.actor), t=S.pending.type;
  if(t==="scorch") scorch(a,i);
  else if(t==="gale") flensingGale(a,i);
  else if(t==="glasszone") glassZone(a,i);
}
function pickWeapon(w){ if(!S.pending) return; S.pending.weapon=w; S.pending.weaponPick=false; S.pending.targets="enemy"; render(); }
function zoneMark(i){ let m=""; if(S.fire[i]>0)m+="🔥"; if(S.grown[i]>0)m+="🌿"; if(S.glass[i]>0)m+="◈"; if(S.well===i)m+="🌀"; return m?(" "+m):""; }
function togglePush(){ if(!S.over && S.phase==="party"){ S.push=!S.push; render(); } }
function passTurn(){ const a=activeActor(); if(a){ log(`${a.name} holds.`,"l-miss"); finishAction(a); } }
function pick(arg){
  if(!S.pending) return;
  const a=U(S.pending.actor); const type=S.pending.type;
  if(type==="scorch"){ scorch(a,arg); return; }
  const target=U(arg);
  if(type==="graft"){ graft(a,target); return; }   // ally target (may be Downed)
  if(type==="aegis"){ aegis(a,target); return; }
  if(type==="cleanse"){ cleanse(a,target); return; }
  if(type==="crush"){ crush(a,target); return; }
  if(type==="strangle"){ strangle(a,target); return; }
  if(type==="lance"){ radiantLance(a,target); return; }
  if(type==="mausoleum"){ sigMausoleum(a,target); return; }
  if(type==="wreck"){ sigWreckingThrow(a,target); return; }
  if(type==="summon"){
    if(target.band>1){ document.getElementById("hint").textContent="Out of reach — conjured weapons hit Engaged or Near."; return; }
    summonArms(a,target); return;
  }
  if(type==="slam"){
    if(target.band>1){ document.getElementById("hint").textContent="Out of reach — Cement Slam only hits Engaged or Near."; return; }
    slam(a,target);
  } else if(type==="fire"){ firebolt(a,target); }
  else if(type==="sledge"){
    if(target.band>1){ document.getElementById("hint").textContent="Out of reach — Sledge hits Engaged or Near."; return; }
    sledge(a,target);
  } else if(type==="rend"){
    if(target.band>1){ document.getElementById("hint").textContent="Out of reach — Rend hits Engaged or Near."; return; }
    rend(a,target);
  } else if(type==="haymaker"){
    if(target.band>1){ document.getElementById("hint").textContent="Out of reach — Haymaker hits Engaged or Near."; return; }
    haymaker(a,target);
  } else if(type==="hurl"){ hurl(a,target); }
}

newGame();
</script>
</body>
</html>
